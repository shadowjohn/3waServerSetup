name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag to publish or resume
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Checkout source resolver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve immutable tag on main
        id: source
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import os; from scripts.build_release import release_version; release_version(os.environ["RELEASE_TAG"])'
          commit=$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git -c safe.directory="$GITHUB_WORKSPACE" merge-base --is-ancestor "$commit" origin/main
          printf 'tag=%s\ncommit=%s\n' "$RELEASE_TAG" "$commit" >> "$GITHUB_OUTPUT"

  verify:
    needs: source
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.source.outputs.commit }}
    permissions:
      contents: read

  build:
    needs: [source, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: ubuntu:26.04
    steps:
      - name: Prepare release builder
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends python3 python3-venv git ca-certificates
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify tag belongs to main
        env:
          RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$RELEASE_COMMIT"
          git -c safe.directory="$GITHUB_WORKSPACE" merge-base --is-ancestor HEAD origin/main
      - name: Download exact runtime wheels and build verified payload
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
        run: |
          python3 -m venv /tmp/threewa-build-venv
          /tmp/threewa-build-venv/bin/python -m pip --isolated download --require-hashes --only-binary=:all: --no-deps -r requirements-tui.lock --dest /tmp/threewa-wheelhouse
          /tmp/threewa-build-venv/bin/python scripts/build_release.py --version "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --wheelhouse /tmp/threewa-wheelhouse --output dist --validated-platform ubuntu26.04 --validated-platform ubuntu24.04 --validated-platform ubuntu22.04
          sh -n dist/install.sh
      - name: Preserve unsigned build inputs for the signing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-inputs
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [source, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout publisher identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      - name: Retrieve the exact tested build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-inputs
          path: dist
      - name: Sign manifest with the dedicated publisher key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_SIGNING_KEY"
          key="$RUNNER_TEMP/threewa-release-signing-key"
          trap 'rm -f -- "$key"' EXIT
          umask 077
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          ssh-keygen -Y sign -f "$key" -n 3wa-release@3wa.tw dist/release-manifest.json
          ssh-keygen -Y verify -f release/allowed_signers -I 3waServerSetup-release -n 3wa-release@3wa.tw -s dist/release-manifest.json.sig < dist/release-manifest.json
          cd dist
          sha256sum -c SHA256SUMS
          sha256sum release-manifest.json.sig >> SHA256SUMS
      - name: Publish complete signed Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.source.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          remote_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          test "$remote_commit" = "$RELEASE_COMMIT"
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'A release with this tag already exists; assets are never overwritten.' >&2
            exit 1
          fi
          printf '%s\n' "3waServerSetting $RELEASE_TAG" '' "Commit: $RELEASE_COMMIT" '' \
            'Ubuntu 22.04 and 24.04 validation covers signed release installation, program updates and primary Ethernet Network management. Other service-management writes remain restricted to Ubuntu 26.04.' '' \
            'Existing Ubuntu 26.04 installer, updater and service-management validation is retained.' '' \
            'Network trials require a new physical SSH connection to the target IP within 120 seconds. Program rollback does not undo confirmed IP settings.' '' \
            'Download install.sh, review it, then run: sudo sh install.sh --release '"$RELEASE_TAG" '' \
            'The installer authenticates the pinned SSH release signature, verifies all payload hashes, and preserves host configuration and backups.' '' \
            'Existing v2026.10.25.001 or v2026.10.26.001 installations must first select bridge v2026.10.26.002 explicitly. The bridge retains Python >=3.12 and Ubuntu 24.04/26.04 metadata.' '' \
            '```sh' \
            '/opt/3waServerSetting/run.sh --update-plan --release-tag v2026.10.26.002' \
            '/opt/3waServerSetting/run.sh --update-apply --release-tag v2026.10.26.002 --confirm' \
            '```' '' \
            'Close old consoles and reopen the program after the bridge update. Then select '"$RELEASE_TAG"' or use the latest release flow:' '' \
            '```sh' \
            '/opt/3waServerSetting/run.sh --update-plan --release-tag '"$RELEASE_TAG" \
            '/opt/3waServerSetting/run.sh --update-apply --release-tag '"$RELEASE_TAG"' --confirm' \
            '```' '' \
            'The older updaters reject Python 3.10 release metadata when selected directly; they do not bridge automatically. New Ubuntu 22.04, 24.04 and 26.04 hosts can install this release directly with its install.sh. Ubuntu 22.04 uses its native Python 3.10.' '' \
            'Updates and rollback change program versions only. Existing service settings, databases and disks are not reverted.' > "$RUNNER_TEMP/threewa-release-notes.md"
          flags=(--latest)
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then flags=(--prerelease --latest=false); fi
          gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "3waServerSetting $RELEASE_TAG" --notes-file "$RUNNER_TEMP/threewa-release-notes.md" "${flags[@]}"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${flags[@]}"

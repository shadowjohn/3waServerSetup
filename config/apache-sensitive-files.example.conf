# OFFLINE CANDIDATE: Apache 2.4; not installed or runtime tested.
# Review effective vhosts, aliases, proxy mappings and later authorization overrides.
# Do not hide a missing authz_core dependency behind IfModule.
<FilesMatch "(?i)^(?:[.]git|[.]env(?:[.].*)?)$">
    AuthMerging Off
    Require all denied
</FilesMatch>

# Filesystem protection for .git directories, including nested/aliased paths.
<DirectoryMatch "(?i)(?:^|/)[.]git(?:/|$)">
    AuthMerging Off
    Require all denied
</DirectoryMatch>

# URL-path protection supplements filesystem scopes, including proxy URL paths.
# This is not a guarantee against alternate URLs or application-served file content.
<LocationMatch "(?i)(?:^|/)(?:[.]git(?:/|$)|[.]env(?:[.][^/]*)?(?:/|$))">
    AuthMerging Off
    Require all denied
</LocationMatch>
